name: Android CI/CD Build & Test

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Release Pecmi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests
        run: gradle test --continue || true

      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "Keystore decoded successfully."
          else
            echo "No KEYSTORE_BASE64 secret provided. Skipping decoding."
          fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Signed Release APK & AAB
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: gradle assembleRelease bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pecmi-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Release Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Pecmi-Signed-Release-Builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
